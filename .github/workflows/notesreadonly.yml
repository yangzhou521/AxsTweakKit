# NotesReadOnly — 「备忘录只读」插件的云编译与发布。
#
# 本机（iPhone10,1 / A11 / iOS 16.7.16 / roothide）没有可用工具链，所以这个 workflow 就是
# 唯一的构建路径：macOS runner 上 clang 直编 arm64 + arm64e 两片再 lipo，ldid 签名，
# dpkg-deb 打包，然后在同一次运行里把 deb 发成 Release 资源（公开仓库匿名可下）。
#
# 只跑 roothide 腿：装到本机的那一份。
#
# 可读的验证信息都写成 check-run 的 annotation（::notice title=…::），因为 job 日志要登录才
# 能看，而公开仓库的 check-run annotations 匿名可读（/repos/{owner}/{repo}/check-runs/{id}/annotations）。
#
# 版本 1.0.9 是静态的：Bump 时同时改 scripts/build-notesreadonly.sh 和下面的 tag。

name: Build NotesReadOnly

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: notesreadonly-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "build-notesreadonly.sh sha256: $(shasum -a 256 scripts/build-notesreadonly.sh)"
          echo "NotesReadOnly.m sha256: $(shasum -a 256 NotesReadOnly/Sources/NotesReadOnly.m)"
          if sh scripts/build-notesreadonly.sh 2>&1 | tee /tmp/nr-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            grep -E "error:|error |not found|undefined|ld: |clang: |fatal|No such file|missing" /tmp/nr-build.log \
              | head -n 8 > /tmp/nr-errs.txt || true
            tail -n 12 /tmp/nr-build.log >> /tmp/nr-errs.txt
            while IFS= read -r line; do
              echo "::error title=build-notesreadonly::$line"
            done < /tmp/nr-errs.txt
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/notesreadonly/out/NotesReadOnly.dylib
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices::$(lipo -info "$DY")"
          # 依赖形状：substrate 那一条必须是 @loader_path/.jbroot/usr/lib/libsubstrate.dylib
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link::$lib"
          done
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesreadonly-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (notesreadonly-v1.0.9)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        # 仓库的 Actions 权限只读时这里会 403；那样就走下面的匿名托管兜底，不让整轮失败。
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: notesreadonly-v1.0.9
          name: NotesReadOnly v1.0.9
          body: |
            备忘录只读 1.0.9 — 在备忘录右上角「•••」菜单里加一个「只读模式」开关。

            - 修复 1.0.8 打开笔记就闪退：同一个选择器挂在多个编辑器类上时，共用一张
              (类, 选择器) → 原 IMP 的总表，父类那一站被 `[super …]` 调进来时又取回自己
              那份「原 IMP」，钩子 → 原 IMP → super → 钩子 无限递归把栈撑爆
              （崩溃里 `setEditable:` 交替上千层）。现在每站各有一个包装函数和自己的原
              IMP 槽，只挂自己声明了该方法的类，super 链路自然到底。
            - 1.0.8 的修复保留：arm64 + arm64e 双切片（1.0.7 只有 arm64e，A11 载不进来）。
            - 只注入 `com.apple.mobilenotes`；开关默认关闭，装完行为不变。
            - 开关与诊断写在备忘录的 `NotesReadOnlyEnabled` / `NotesReadOnlyDiagnostics`。
          files: release/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls release/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/notesreadonly-v1.0.9/$(basename "$DEB")"

      - name: Fallback anonymous upload
        if: steps.publish.outcome != 'success'
        run: |
          set -uo pipefail
          for f in release/*.deb; do
            echo "release step did not succeed; uploading $f anonymously"
            url=$(curl -sS --max-time 120 -A "AxsTweakKit-CI" -F "file=@$f" https://0x0.st || true)
            if [ -z "$url" ] || ! printf '%s' "$url" | grep -q '^https'; then
              echo "0x0.st failed, trying catbox"
              url=$(curl -sS --max-time 120 -A "AxsTweakKit-CI" -F "reqtype=fileupload" -F "fileToUpload=@$f" https://catbox.moe/user/api.php || true)
            fi
            echo "fallback url for $f: $url"
            echo "::notice title=deb-url::$url"
          done
