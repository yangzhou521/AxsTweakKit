# AxsTweakKit — cloud build of both bootstraps' .deb on GitHub Actions.
#
# This device (A11, no toolchain) cannot compile anything, so this workflow is
# the build path: it runs scripts/build.sh (plain clang + ldid + dpkg-deb, no
# Theos, no Logos) on a macOS runner for roothide AND rootless, and on manual
# runs attaches both debs to a GitHub Release.
#
# NOT VERIFIED: nothing in this file had run on a runner until 2026-10-28,
# when run #2 failed at Build Package for both matrix legs. The failure was
# the substrate link: the layout inside roothide/theos was re-checked against
# the repository and corrected (substrate = CydiaSubstrate.framework in the
# vendor/lib submodule). The fix below has not yet produced a passing run.
#
# Version: the package version is static 1.0.0, kept in step with
# scripts/build.sh and Docs/apelin-project.tweak.json. Bump all three together
# (and the v1.0.0 tag below) before re-releasing.

name: Build AxsTweakKit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk

jobs:
  build:
    name: Build (${{ matrix.bootstrap }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        bootstrap:
          - roothide
          - rootless
    env:
      # scripts/build.sh honours these; the arch tag is decided inside it
      # (roothide -> iphoneos-arm64e, rootless -> iphoneos-arm64).
      APELIN_BOOTSTRAP: ${{ matrix.bootstrap }}
      APELIN_CONFIGURATION: release
      APELIN_PACKAGE_DIR: packages
      # The tweak dylib and the preference bundle share one header story,
      # checked against roothide/theos master after run #2 failed:
      #   - the full iOS header set (public + private, incl. substrate.h,
      #     Preferences, SpringBoard, …) lives in $THEOS/vendor/include
      #     (submodule roothide/headers). $THEOS/include is empty.
      #   - substrate is the prebuilt CydiaSubstrate.framework in
      #     $THEOS/vendor/lib (submodule roothide/lib): its tbd exports
      #     MSHookMessageEx & co for armv7/armv7s/arm64/arm64e.
      #     $THEOS/lib has no substrate, and vendor/lib/libsubstrate.tbd is
      #     only a one-line pointer to the framework's tbd.
      SUBSTRATE_CFLAGS: -I${{ github.workspace }}/theos/vendor/include
      SUBSTRATE_LDFLAGS: -F${{ github.workspace }}/theos/vendor/lib -framework CydiaSubstrate

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: |
          brew install ldid dpkg

      - name: Build Package
        run: |
          set -o pipefail
          if sh scripts/build.sh > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            cat /tmp/build.log
            # The job log needs a login to read; an annotation on the check run
            # is public, so the failure is readable from the repository API.
            grep -E "error:|error |not found|undefined|ld: |clang: |fatal|No such file" /tmp/build.log \
              | head -n 4 > /tmp/errs.txt || true
            tail -n 5 /tmp/build.log >> /tmp/errs.txt
            while IFS= read -r line; do
              echo "::error title=build.sh::$line"
            done < /tmp/errs.txt
            exit 1
          fi

      - name: Verify slices and package
        run: |
          echo "=== dylib slices ==="
          lipo -info build/out/AxsTweakKit.dylib
          lipo -info build/out/AxsTweakKitPrefs
          echo "=== package control ==="
          dpkg-deb -I packages/*.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.bootstrap }}
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (v1.0.0)
    # A static tag cannot be re-created; releasing only from the manual
    # trigger keeps push runs to pure builds. Bump VERSION in scripts/build.sh
    # and Docs/apelin-project.tweak.json together with the tag before a
    # second manual release.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v1.0.0
          name: AxsTweakKit v1.0.0
          body: |
            AxsTweakKit 1.0.0 — SpringBoard 插件脚手架（hook 骨架、只读配置快照、设置面板与自定义滑条）。

            - `com.axs.axstweakkit_1.0.0_iphoneos-arm64e.deb` — roothide 包，含 arm64 + arm64e 双切片，装到本机（A11）
            - `com.axs.axstweakkit_1.0.0_iphoneos-arm64.deb` — rootless 包（/var/jb）
          files: release/*.deb
